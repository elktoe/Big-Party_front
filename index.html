<!DOCTYPE html>
<html>
<head>
  <title>Event</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
  
<body>
  <h1>Welcome to Our Event</h1>
  <p>RSVP coming soon.</p>
</body>


<button id="btn">Ask the backend</button>
<p id="out"></p>

<script>
  const API_URL = "http://127.0.0.1:8000";

  document.getElementById("btn").addEventListener("click", async () => {
    try {
      const res = await fetch(API_URL + "/hello");
      const data = await res.json();
      document.getElementById("out").textContent = data.message;
    } catch (err) {
      document.getElementById("out").textContent = "Could not reach the backend.";
      console.error(err);
    }
  });
</script>
